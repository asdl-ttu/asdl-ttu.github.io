<figure class="tspan" aria-label="Temperature range studied by the lab">
  <div class="cap">Characterization envelope · temperature (K), log scale</div>
  <svg viewBox="0 0 360 170" role="img" aria-label="Temperature axis from 4 K to 1000 K with markers for liquid helium, liquid nitrogen, room temperature and 600 K">
    <defs>
      <linearGradient id="tg" x1="0" x2="1">
        <stop offset="0" stop-color="#2f6fd6"/><stop offset=".55" stop-color="#9a8f8f"/><stop offset="1" stop-color="#CC0000"/>
      </linearGradient>
    </defs>
    <!-- log scale: x = 20 + (log10(T) - log10(4)) / (log10(1000) - log10(4)) * 320 -->
    <rect x="20" y="78" width="320" height="12" fill="url(#tg)"/>
    <g stroke="var(--muted)" stroke-width="1">
      <line x1="20" y1="90" x2="20" y2="98"/>
      <line x1="73.1" y1="90" x2="73.1" y2="98"/>
      <line x1="206.6" y1="90" x2="206.6" y2="98"/>
      <line x1="340" y1="90" x2="340" y2="98"/>
    </g>
    <text class="ax" x="20" y="112" text-anchor="start">4</text>
    <text class="ax" x="73.1" y="112" text-anchor="middle">10</text>
    <text class="ax" x="206.6" y="112" text-anchor="middle">100</text>
    <text class="ax" x="340" y="112" text-anchor="end">1000</text>
    <g>
      <circle cx="22.8" cy="84" r="4.5" fill="#fff" stroke="#2f6fd6" stroke-width="2"/>
      <circle cx="191.3" cy="84" r="4.5" fill="#fff" stroke="#6d6aa8" stroke-width="2"/>
      <circle cx="270.2" cy="84" r="4.5" fill="#fff" stroke="#8a4040" stroke-width="2"/>
      <circle cx="310.4" cy="84" r="4.5" fill="#fff" stroke="#CC0000" stroke-width="2"/>
    </g>
    <g stroke="var(--line)" stroke-width="1">
      <line x1="22.8" y1="72" x2="22.8" y2="40"/><line x1="191.3" y1="72" x2="191.3" y2="40"/>
      <line x1="270.2" y1="72" x2="270.2" y2="22"/><line x1="310.4" y1="72" x2="310.4" y2="56"/>
    </g>
    <text class="lbl" x="22.8" y="34">LHe · 4.2 K</text>
    <text class="lbl" x="191.3" y="34" text-anchor="middle">LN₂ · 77 K</text>
    <text class="lbl" x="270.2" y="16" text-anchor="middle">Room · 300 K</text>
    <text class="lbl" x="340" y="52" text-anchor="end">600 K</text>
    <text class="ax" x="20" y="142">Cryogenic LNAs, Qubit Readout</text>
    <text class="ax" x="340" y="160" text-anchor="end">Power, RF, Harsh Environments</text>
  </svg>
  <figcaption class="cap" style="margin-top:6px;text-transform:none">Overall range across our setups; each method has its own usable window.</figcaption>
</figure>
