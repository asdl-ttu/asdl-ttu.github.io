- date: 2026 · Aug
  tag: Funding
  featured: true
  title: NSF Awards $450,000 to Advance Radiation-Hardened GaN Electronics
  summary: >-
    The National Science Foundation has awarded $450,000 to Dr. Taewoo Kim (PI) and Dr. Ravindra Joshi,
    ECE Chair (co-PI), to study how proton radiation affects GaN high-electron-mobility transistors. Working with
    Los Alamos National Laboratory's Ion Beam Materials Laboratory through the Center for Integrated
    Nanotechnologies, the team will link radiation-induced defects to changes in charge transport and build a
    physics-based framework for radiation-hardness-by-design. The goal is to cut device qualification from months
    of testing to as little as one confirmatory test, for satellite communications, defense radar, deep-space
    missions and high-power electronics.
  quote: Our goal is to move beyond empirical radiation testing and establish a predictive understanding …
  quote_by: Dr. Taewoo Kim
  source: Whitacre College of Engineering News, August 20, 2026
  link: https://www.depts.ttu.edu/coe/wcoenews/posts/2026/08/NSF-Award-Kim-Joshi-radiation-hardened-electronics.php
  text: "NSF awards $450,000 to Dr. Taewoo Kim and Dr. Ravindra Joshi to advance radiation-hardened GaN electronics, in collaboration with Los Alamos National Laboratory."

